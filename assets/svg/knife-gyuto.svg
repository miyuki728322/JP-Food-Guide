<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <title>Gyuto — Japanese Chef's Knife</title>
  <!-- Blade body -->
  <path d="M30 72 L420 58 L460 54 L490 46 L500 44 L492 48 L462 58 L422 65 L30 80 Z" fill="#B8C4CC" stroke="#6B7C8A" stroke-width="0.8"/>
  <!-- Blade edge (cutting edge curve) -->
  <path d="M30 80 Q200 82 380 65 Q440 58 492 48" stroke="#8A9BA8" stroke-width="0.6" fill="none"/>
  <!-- Spine highlight -->
  <path d="M30 72 L420 58 L490 46" stroke="#D8E2E8" stroke-width="1.2" fill="none"/>
  <!-- Tip -->
  <path d="M490 46 L500 44 L492 48 Z" fill="#9AAAB5"/>
  <!-- Blade face center line -->
  <line x1="50" y1="75" x2="430" y2="61" stroke="#CBD5DB" stroke-width="0.4" stroke-dasharray="4 6"/>
  <!-- Bolster -->
  <rect x="22" y="58" width="12" height="26" rx="2" fill="#6B7C8A"/>
  <!-- Handle — octagonal wa style -->
  <path d="M10 60 L22 58 L34 58 L34 84 L22 84 L10 82 Z" fill="#5C4A38"/>
  <path d="M0 62 L10 60 L10 82 L0 80 Z" fill="#7A6248"/>
  <line x1="10" y1="60" x2="10" y2="82" stroke="#3D2E1E" stroke-width="0.5"/>
  <!-- Label -->
  <text x="200" y="102" font-family="Georgia, serif" font-size="11" fill="#2C3E50" letter-spacing="3">G Y U T O</text>
  <text x="200" y="114" font-family="Georgia, serif" font-size="8" fill="#7F8C8D" letter-spacing="2">牛刀  ·  CHEF'S KNIFE</text>
</svg>
