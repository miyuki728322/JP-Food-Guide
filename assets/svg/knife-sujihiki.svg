<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" fill="none">
  <title>Sujihiki — Slicing Knife</title>
  <!-- Blade — long and very narrow (double bevel) -->
  <path d="M30 66 L470 56 L510 52 L540 46 L548 44 L540 49 L512 56 L472 63 L30 73 Z" fill="#BDC8CE" stroke="#6B7C8A" stroke-width="0.7"/>
  <!-- Spine highlight -->
  <path d="M30 66 L470 56 L540 46" stroke="#D8E2E8" stroke-width="1.2" fill="none"/>
  <!-- Narrow profile center -->
  <path d="M30 69 Q250 67 470 59 Q510 54 540 47" stroke="#CBD5DB" stroke-width="0.5" fill="none" stroke-dasharray="6 8"/>
  <!-- Tip -->
  <path d="M540 46 L548 44 L540 49 Z" fill="#9AAAB5"/>
  <!-- Bolster — slim -->
  <rect x="23" y="59" width="8" height="18" rx="1" fill="#5A6B78"/>
  <!-- Handle — western full tang -->
  <path d="M4 61 L23 59 L31 59 L31 77 L23 77 L4 75 Z" fill="#3A2E26"/>
  <circle cx="10" cy="68" r="2" fill="#8A7060"/>
  <circle cx="18" cy="68" r="2" fill="#8A7060"/>
  <circle cx="26" cy="68" r="2" fill="#8A7060"/>
  <!-- Label -->
  <text x="210" y="96" font-family="Georgia, serif" font-size="11" fill="#2C3E50" letter-spacing="3">S U J I H I K I</text>
  <text x="210" y="108" font-family="Georgia, serif" font-size="8" fill="#7F8C8D" letter-spacing="2">筋引き  ·  SLICING KNIFE</text>
</svg>
