<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 110" fill="none">
  <title>Yanagiba — Sashimi Knife</title>
  <!-- Blade body — long narrow willow shape -->
  <path d="M30 70 L480 56 L520 52 L550 46 L560 44 L552 49 L522 56 L482 62 L30 76 Z" fill="#C2CBCE" stroke="#6B7C8A" stroke-width="0.7"/>
  <!-- Single bevel — flat face highlight -->
  <line x1="32" y1="70" x2="545" y2="47" stroke="#E0E8EC" stroke-width="1.8"/>
  <!-- Spine -->
  <line x1="32" y1="70" x2="548" y2="46" stroke="#8A9BA8" stroke-width="0.4"/>
  <!-- Tip -->
  <path d="M550 46 L560 44 L552 49 Z" fill="#8A9BA8"/>
  <!-- Bolster (thinner for yanagiba) -->
  <rect x="24" y="62" width="8" height="18" rx="1" fill="#5A6B78"/>
  <!-- Handle — long traditional Ho wood -->
  <path d="M5 65 L24 62 L32 62 L32 80 L24 80 L5 77 Z" fill="#6E5540"/>
  <path d="M0 66 L5 65 L5 77 L0 76 Z" fill="#8A6E55"/>
  <line x1="5" y1="65" x2="5" y2="77" stroke="#3D2E1E" stroke-width="0.5"/>
  <!-- Buffalo horn collar -->
  <rect x="22" y="60" width="5" height="22" fill="#2C1A0E"/>
  <!-- Label -->
  <text x="220" y="96" font-family="Georgia, serif" font-size="11" fill="#2C3E50" letter-spacing="3">Y A N A G I B A</text>
  <text x="220" y="108" font-family="Georgia, serif" font-size="8" fill="#7F8C8D" letter-spacing="2">柳刃  ·  SASHIMI KNIFE</text>
</svg>
