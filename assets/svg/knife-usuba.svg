<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" fill="none">
  <title>Usuba — Thin Blade Vegetable Knife</title>
  <!-- Blade — rectangular, single bevel (like Nakiri but single-bevel) -->
  <rect x="30" y="36" width="325" height="64" rx="1" fill="#C0CBCE" stroke="#6B7C8A" stroke-width="0.8"/>
  <!-- Spine highlight -->
  <line x1="30" y1="37" x2="355" y2="37" stroke="#D8E2E8" stroke-width="1.5"/>
  <!-- Single bevel flat face — strong highlight on one side -->
  <rect x="30" y="36" width="325" height="10" rx="0" fill="rgba(224,232,236,0.6)"/>
  <!-- Ura (back) — subtle hollow ground indication -->
  <path d="M30 100 Q180 102 355 100" stroke="#8A9BA8" stroke-width="1" fill="none"/>
  <!-- Right tip — squared -->
  <path d="M355 36 Q362 36 362 43 L362 100 L355 100 Z" fill="#A8B5BC"/>
  <!-- Bolster — minimal -->
  <rect x="22" y="32" width="10" height="72" rx="1" fill="#5A6B78"/>
  <!-- Handle — traditional ho wood, octagonal -->
  <path d="M5 38 L22 34 L32 34 L32 104 L22 104 L5 100 Z" fill="#6E5540"/>
  <path d="M0 40 L5 38 L5 100 L0 98 Z" fill="#8A6E55"/>
  <!-- Buffalo horn collar -->
  <rect x="21" y="32" width="4" height="72" fill="#2C1A0E"/>
  <!-- Label -->
  <text x="130" y="118" font-family="Georgia, serif" font-size="11" fill="#2C3E50" letter-spacing="3">U S U B A</text>
  <text x="130" y="128" font-family="Georgia, serif" font-size="8" fill="#7F8C8D" letter-spacing="2">薄刃  ·  THIN BLADE</text>
</svg>
