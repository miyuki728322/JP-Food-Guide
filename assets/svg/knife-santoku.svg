<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" fill="none">
  <title>Santoku — Three Virtues Knife</title>
  <!-- Blade body — short with sheep's foot tip -->
  <path d="M30 64 L300 54 L320 56 L328 62 L328 80 L30 82 Z" fill="#B8C4CC" stroke="#6B7C8A" stroke-width="0.8"/>
  <!-- Sheep's foot tip drop -->
  <path d="M300 54 L320 56 L328 62 L318 55 Z" fill="#9AAAB5"/>
  <!-- Spine — nearly flat -->
  <line x1="30" y1="64" x2="302" y2="54" stroke="#D8E2E8" stroke-width="1.2"/>
  <!-- Granton hollow edge dimples -->
  <ellipse cx="130" cy="68" rx="12" ry="4" fill="none" stroke="#CBD5DB" stroke-width="0.6"/>
  <ellipse cx="180" cy="68" rx="12" ry="4" fill="none" stroke="#CBD5DB" stroke-width="0.6"/>
  <ellipse cx="230" cy="67" rx="12" ry="4" fill="none" stroke="#CBD5DB" stroke-width="0.6"/>
  <ellipse cx="280" cy="65" rx="10" ry="3.5" fill="none" stroke="#CBD5DB" stroke-width="0.6"/>
  <!-- Bolster -->
  <rect x="22" y="56" width="10" height="30" rx="2" fill="#6B7C8A"/>
  <!-- Handle — western style -->
  <path d="M4 58 L22 56 L32 56 L32 86 L22 86 L4 84 Z" fill="#2C3E50"/>
  <line x1="12" y1="62" x2="12" y2="82" stroke="#1A2530" stroke-width="2"/>
  <line x1="20" y1="60" x2="20" y2="84" stroke="#1A2530" stroke-width="2"/>
  <circle cx="8" cy="72" r="2" fill="#C4A882"/>
  <circle cx="16" cy="72" r="2" fill="#C4A882"/>
  <circle cx="24" cy="71" r="2" fill="#C4A882"/>
  <!-- Label -->
  <text x="110" y="102" font-family="Georgia, serif" font-size="11" fill="#2C3E50" letter-spacing="3">S A N T O K U</text>
  <text x="110" y="114" font-family="Georgia, serif" font-size="8" fill="#7F8C8D" letter-spacing="2">三徳  ·  THREE VIRTUES</text>
</svg>
